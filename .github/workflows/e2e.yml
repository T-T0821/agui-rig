name: e2e

# 開発ビルドのアプリを、模擬サーバー (dev/mock-server.mjs) に向けて tauri-driver で操作する。
# スクリーンショットと録画は成果物 (e2e-artifacts) に残す。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri
          key: e2e

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            xvfb ffmpeg fonts-noto-cjk
          # WebKitWebDriver のパッケージ名は Ubuntu の版で違う (新しい版は webkitgtk-webdriver)
          sudo apt-get install -y webkitgtk-webdriver || sudo apt-get install -y webkit2gtk-driver
          which WebKitWebDriver

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app (debug, no bundle)
        run: pnpm tauri build --debug --no-bundle

      - name: Run E2E tests
        run: xvfb-run -a -s "-screen 0 1280x800x24" pnpm e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: app/desktop/e2e/artifacts
          if-no-files-found: ignore
