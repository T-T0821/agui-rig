name: terraform

on:
  push:
    branches: [main]
    paths: ["infra/terraform/**", "infra/dev-account/**", "app/backend/**", "pnpm-lock.yaml", ".github/workflows/terraform.yml"]
  pull_request:
    paths: ["infra/terraform/**", "infra/dev-account/**", "app/backend/**", "pnpm-lock.yaml", ".github/workflows/terraform.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [infra/terraform, infra/dev-account]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13"

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Type check, test and build
        run: |
          pnpm install --frozen-lockfile
          pnpm backend:typecheck
          pnpm backend:test
          pnpm backend:build
