AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  agui-rig のチャット履歴と利用料金: AppSync (OpenID Connect 認証) + DynamoDB + (任意) Langfuse を読む Lambda。
  アプリは共通基盤の ID トークンで AppSync を呼び、リゾルバーがトークンの sub で利用者ごとに分ける。

Parameters:
  OidcIssuer:
    Type: String
    Description: 共通基盤の issuer (例 https://auth.example.com)。ID トークンの iss と完全に一致させる
  OidcClientId:
    Type: String
    Description: アプリの OAuth クライアント ID (ID トークンの aud)
  TableName:
    Type: String
    Default: agui-rig-chat-history
  # ---- 利用料金 (任意)。LangfuseSecretArn を空にすると作らない ----
  LangfuseSecretArn:
    Type: String
    Default: ""
    Description: >-
      Langfuse のキーを入れた Secrets Manager のシークレット ARN
      (JSON: {"publicKey": "pk-lf-...", "secretKey": "sk-lf-..."})。空なら利用料金の機能を作らない
  LangfuseHost:
    Type: String
    Default: ""
    Description: Lambda から見た Langfuse の URL (例 http://langfuse-web.langfuse.svc の前に置いた内部 ALB の URL)
  LambdaSubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: Langfuse (EKS) に届く VPC のサブネット。Secrets Manager にも届くこと (VPC エンドポイントか NAT)
  LambdaSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ""
  UtcOffsetMinutes:
    Type: Number
    Default: 540
    Description: 「今日」「今月」の区切りに使うタイムゾーン (分)。日本は 540

Conditions:
  UsageEnabled: !Not [!Equals [!Ref LangfuseSecretArn, ""]]

Resources:
  # pk = 利用者の sub、sk = 会話 ID。会話 1 件 = 1 項目 (メッセージは gzip + base64 で 1 属性に)
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  Api:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: agui-rig-chat-history
      AuthenticationType: OPENID_CONNECT
      OpenIDConnectConfig:
        Issuer: !Ref OidcIssuer
        ClientId: !Ref OidcClientId
        AuthTTL: 3600000
        IatTTL: 3600000

  Schema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt Api.ApiId
      Definition: |
        type Thread {
          id: ID!
          title: String!
          updatedAt: AWSDateTime!
          "メッセージ (AG-UI の形の JSON 配列) を gzip して base64 にしたもの"
          messagesGz: String
        }

        "利用料金 (Langfuse が計算したもの。USD)"
        type Usage {
          todayUsd: Float!
          monthUsd: Float!
          "集計の始まり (今月 1 日 0 時)"
          monthStart: AWSDateTime!
        }

        type Query {
          "自分の会話の一覧 (メッセージは含まない)"
          threads: [Thread!]!
          "自分の会話 1 件"
          thread(id: ID!): Thread
          "自分の利用料金 (利用料金の機能を作っていなければ null)"
          usage: Usage
        }

        type Mutation {
          saveThread(id: ID!, title: String!, messagesGz: String!): Thread!
          deleteThread(id: ID!): Boolean!
        }

  DataSourceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: appsync.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: chat-history-table
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
                Resource: !GetAtt Table.Arn

  DataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt Api.ApiId
      Name: ChatHistoryTable
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt DataSourceRole.Arn
      DynamoDBConfig:
        TableName: !Ref Table
        AwsRegion: !Ref AWS::Region

  # リゾルバーはすべて ctx.identity.sub (AppSync が検証した ID トークンの sub) だけを pk に使う。
  # 引数で利用者を指定する方法は無いので、他人の会話には届かない。
  ThreadsResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: Schema
    Properties:
      ApiId: !GetAtt Api.ApiId
      TypeName: Query
      FieldName: threads
      DataSourceName: !GetAtt DataSource.Name
      Runtime: { Name: APPSYNC_JS, RuntimeVersion: 1.0.0 }
      Code: |
        import { util } from "@aws-appsync/utils";
        export function request(ctx) {
          return {
            operation: "Query",
            query: { expression: "pk = :pk", expressionValues: { ":pk": { S: ctx.identity.sub } } },
            projection: { expression: "sk, title, updatedAt" },
            scanIndexForward: false,
            limit: 200,
          };
        }
        export function response(ctx) {
          if (ctx.error) util.error(ctx.error.message, ctx.error.type);
          // 並べ替え (新しい順) はアプリ側で行う
          return ctx.result.items.map((i) => ({ id: i.sk, title: i.title, updatedAt: i.updatedAt }));
        }

  ThreadResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: Schema
    Properties:
      ApiId: !GetAtt Api.ApiId
      TypeName: Query
      FieldName: thread
      DataSourceName: !GetAtt DataSource.Name
      Runtime: { Name: APPSYNC_JS, RuntimeVersion: 1.0.0 }
      Code: |
        import { util } from "@aws-appsync/utils";
        import * as ddb from "@aws-appsync/utils/dynamodb";
        export function request(ctx) {
          return ddb.get({ key: { pk: ctx.identity.sub, sk: ctx.args.id } });
        }
        export function response(ctx) {
          if (ctx.error) util.error(ctx.error.message, ctx.error.type);
          const i = ctx.result;
          return i ? { id: i.sk, title: i.title, updatedAt: i.updatedAt, messagesGz: i.messagesGz } : null;
        }

  SaveThreadResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: Schema
    Properties:
      ApiId: !GetAtt Api.ApiId
      TypeName: Mutation
      FieldName: saveThread
      DataSourceName: !GetAtt DataSource.Name
      Runtime: { Name: APPSYNC_JS, RuntimeVersion: 1.0.0 }
      Code: |
        import { util } from "@aws-appsync/utils";
        export function request(ctx) {
          const now = util.time.nowISO8601();
          return {
            operation: "UpdateItem",
            key: util.dynamodb.toMapValues({ pk: ctx.identity.sub, sk: ctx.args.id }),
            update: {
              expression: "SET title = :title, messagesGz = :m, updatedAt = :now, createdAt = if_not_exists(createdAt, :now)",
              expressionValues: util.dynamodb.toMapValues({ ":title": ctx.args.title, ":m": ctx.args.messagesGz, ":now": now }),
            },
          };
        }
        export function response(ctx) {
          if (ctx.error) util.error(ctx.error.message, ctx.error.type);
          const i = ctx.result;
          return { id: i.sk, title: i.title, updatedAt: i.updatedAt };
        }

  DeleteThreadResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: Schema
    Properties:
      ApiId: !GetAtt Api.ApiId
      TypeName: Mutation
      FieldName: deleteThread
      DataSourceName: !GetAtt DataSource.Name
      Runtime: { Name: APPSYNC_JS, RuntimeVersion: 1.0.0 }
      Code: |
        import { util } from "@aws-appsync/utils";
        import * as ddb from "@aws-appsync/utils/dynamodb";
        export function request(ctx) {
          return ddb.remove({ key: { pk: ctx.identity.sub, sk: ctx.args.id } });
        }
        export function response(ctx) {
          if (ctx.error) util.error(ctx.error.message, ctx.error.type);
          return true;
        }

  # ---- 利用料金: AppSync → Lambda (VPC 内) → Langfuse の集計 API ----
  UsageFunctionRole:
    Type: AWS::IAM::Role
    Condition: UsageEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: langfuse-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref LangfuseSecretArn

  UsageFunction:
    Type: AWS::Lambda::Function
    Condition: UsageEnabled
    Properties:
      Description: Langfuse から、呼び出した利用者 (sub) の今日と今月の料金を返す
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 15
      MemorySize: 256
      Role: !GetAtt UsageFunctionRole.Arn
      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds: !Ref LambdaSecurityGroupIds
      Environment:
        Variables:
          LANGFUSE_HOST: !Ref LangfuseHost
          LANGFUSE_SECRET_ARN: !Ref LangfuseSecretArn
          UTC_OFFSET_MINUTES: !Ref UtcOffsetMinutes
      Code:
        ZipFile: |
          // AppSync から { sub } だけを受け取り、その利用者の料金だけを返す。
          // Langfuse のキーはこの Lambda だけが持つ (アプリには渡さない)。
          const { SecretsManagerClient, GetSecretValueCommand } = require("@aws-sdk/client-secrets-manager");
          const secrets = new SecretsManagerClient({});
          let authHeader;

          async function auth() {
            if (!authHeader) {
              const s = await secrets.send(new GetSecretValueCommand({ SecretId: process.env.LANGFUSE_SECRET_ARN }));
              const { publicKey, secretKey } = JSON.parse(s.SecretString);
              authHeader = "Basic " + Buffer.from(`${publicKey}:${secretKey}`).toString("base64");
            }
            return authHeader;
          }

          // 期間内の料金の合計 (Langfuse の日次集計 API。ページをたどる)
          async function costBetween(sub, from, to) {
            let total = 0;
            for (let page = 1; page <= 20; page++) {
              const url = new URL("/api/public/metrics/daily", process.env.LANGFUSE_HOST);
              url.search = new URLSearchParams({
                userId: sub, fromTimestamp: from.toISOString(), toTimestamp: to.toISOString(), page: String(page), limit: "100",
              });
              const res = await fetch(url, { headers: { Authorization: await auth() } });
              if (!res.ok) throw new Error(`Langfuse: ${res.status}`);
              const body = await res.json();
              total += (body.data ?? []).reduce((sum, d) => sum + (d.totalCost ?? 0), 0);
              if (page >= (body.meta?.totalPages ?? 1)) break;
            }
            return total;
          }

          exports.handler = async (event) => {
            const sub = event.sub;
            if (!sub) throw new Error("Unauthorized");
            const offset = Number(process.env.UTC_OFFSET_MINUTES ?? 0) * 60_000;
            const now = new Date();
            const local = new Date(now.getTime() + offset);
            const todayStart = new Date(Date.UTC(local.getUTCFullYear(), local.getUTCMonth(), local.getUTCDate()) - offset);
            const monthStart = new Date(Date.UTC(local.getUTCFullYear(), local.getUTCMonth(), 1) - offset);
            const [todayUsd, monthUsd] = await Promise.all([costBetween(sub, todayStart, now), costBetween(sub, monthStart, now)]);
            return { todayUsd, monthUsd, monthStart: monthStart.toISOString() };
          };

  UsageDataSourceRole:
    Type: AWS::IAM::Role
    Condition: UsageEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: appsync.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-usage-function
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt UsageFunction.Arn

  UsageDataSource:
    Type: AWS::AppSync::DataSource
    Condition: UsageEnabled
    Properties:
      ApiId: !GetAtt Api.ApiId
      Name: LangfuseUsage
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt UsageDataSourceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt UsageFunction.Arn

  UsageResolver:
    Type: AWS::AppSync::Resolver
    Condition: UsageEnabled
    DependsOn: Schema
    Properties:
      ApiId: !GetAtt Api.ApiId
      TypeName: Query
      FieldName: usage
      DataSourceName: !GetAtt UsageDataSource.Name
      Runtime: { Name: APPSYNC_JS, RuntimeVersion: 1.0.0 }
      # Lambda には検証済みの sub だけを渡す
      Code: |
        import { util } from "@aws-appsync/utils";
        export function request(ctx) {
          return { operation: "Invoke", payload: { sub: ctx.identity.sub } };
        }
        export function response(ctx) {
          if (ctx.error) util.error(ctx.error.message, ctx.error.type);
          return ctx.result;
        }

Outputs:
  GraphQLUrl:
    Description: アプリの CHAT_API_URL に設定する
    Value: !GetAtt Api.GraphQLUrl
  TableName:
    Value: !Ref Table
