# ルートの `pnpm install` で全部の依存を入れる。コマンドはルートの package.json から実行する
packages:
  - app/desktop
  - app/desktop/examples/time-mcp
  - app/desktop/e2e
  - app/backend

# インストール時にスクリプトを実行してよい依存 (pnpm 10 は既定で止める)
onlyBuiltDependencies:
  - esbuild

# 利用状況の送信だけのスクリプトなので実行しない
ignoredBuiltDependencies:
  - "@scarf/scarf"
  # WebdriverIO が他のブラウザ用に持つドライバーのダウンロード。E2E は tauri-driver を使うので要らない
  - edgedriver
  - geckodriver
