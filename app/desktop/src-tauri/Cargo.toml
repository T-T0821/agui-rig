[package]
name = "rig-agui-chat"
version = "0.2.0"
edition = "2024"
license = "MIT"

[lib]
name = "rig_agui_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "process"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio-stream = "0.1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
dirs = "7"

# LLM (Rig + Bedrock)
rig-core = { version = "0.46", features = ["reqwest"] }
rig-bedrock = "0.46"

# AWS (STS の一時認証情報、AgentCore Code Interpreter)
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-sdk-sts = "1"
aws-sdk-bedrockruntime = "1"
aws-sdk-bedrockagentcore = "1"

# stdio MCP クライアント
rmcp = { version = "3", features = ["client", "transport-async-rw"] }

# OAuth (PKCE)
reqwest = { version = "0.13", features = ["json", "form", "blocking"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
url = "2"
flate2 = "1"

# ログとトレース (OpenTelemetry → Langfuse などの OTLP 受け口)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["trace"] }
opentelemetry-http = "0.33"
async-trait = "0.1"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
